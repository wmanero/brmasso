server {
    listen 80;
    server_name espacobarbararodrigues.com.br www.espacobarbararodrigues.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name espacobarbararodrigues.com.br www.espacobarbararodrigues.com.br;

    ssl_certificate /etc/letsencrypt/live/espacobarbararodrigues.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/espacobarbararodrigues.com.br/privkey.pem;

    # Serve a Landing Page Estática diretamente da pasta ./frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Redireciona as chamadas de API da Landing Page para o container Backend Python
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
